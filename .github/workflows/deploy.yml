name: Deploy to web host (FTP)

# Builds the site and uploads dist/ to the web host over FTP.
#
# It runs on every push to main (that is, every merged pull request) and can
# also be started by hand from the Actions tab.
#
# SAFETY SWITCH: nothing is uploaded until the repository variable
# FTP_DEPLOY_ENABLED is set to "true". This stops the unfinished rebuild from
# replacing the live v9 site before it is ready.
#
# Required secrets (Settings > Secrets and variables > Actions > Secrets):
#   FTP_SERVER      e.g. ftp.webuiltthis.co.uk
#   FTP_USERNAME
#   FTP_PASSWORD
# Required variables (same page, Variables tab):
#   FTP_DEPLOY_ENABLED  "true" to allow uploads
#   FTP_REMOTE_DIR      folder on the host, with a trailing slash,
#                       e.g. /public_html/SkyScanner/
# Optional variables:
#   FTP_PROTOCOL        ftps (default) or ftp if the host has no TLS
#   SITE_URL            live URL to back up first (default
#                       https://webuiltthis.co.uk/SkyScanner/)
#
# Before each upload, the live page and the files it loads are downloaded and
# kept for 90 days as a "live-site-backup" artifact on the workflow run.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.FTP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Without a target folder, the upload lands in the FTP account's top
      # folder instead of the site's. Stop before anything is uploaded.
      - name: Check the deploy settings
        env:
          REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
        run: |
          if [ -z "$REMOTE_DIR" ]; then
            echo "::error::The FTP_REMOTE_DIR variable is empty. Add it under Settings > Secrets and variables > Actions > Variables (not Secrets), e.g. public_html/SkyScanner/"
            exit 1
          fi
          case "$REMOTE_DIR" in
            */) ;;
            *) echo "::error::FTP_REMOTE_DIR must end with a slash, e.g. public_html/SkyScanner/"; exit 1 ;;
          esac
          echo "Uploading to: $REMOTE_DIR"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # Keep a copy of whatever is live before replacing it. The v9 source is
      # lost, so the live site is the only copy of that version. If this step
      # fails, nothing is uploaded.
      - name: Back up the live site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://webuiltthis.co.uk/SkyScanner/' }}
        run: |
          mkdir -p live-backup
          cd live-backup
          wget --page-requisites --no-parent --no-host-directories --tries=3 --timeout=30 \
            --user-agent="SkyShot deploy backup" "$SITE_URL" || [ $? -eq 8 ]  # 8 = some file 404'd
          find . -type f | sort
          test -s "$(find . -name index.html -print -quit)"

      - name: Save the backup
        uses: actions/upload-artifact@v4
        with:
          name: live-site-backup-${{ github.run_number }}
          path: live-backup/
          retention-days: 90

      - name: Upload dist/ over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_REMOTE_DIR }}
          # Only changed files are uploaded. Old files on the host are never
          # wiped, so a bad config can't delete the rest of the site.
          dangerous-clean-slate: false
